name: Python package

# Builds the `sinomo-ui` wheels and sdist, tests the built artifacts in
# clean environments, and publishes with PyPI trusted publishing:
# - pushing a `v*` release tag publishes to PyPI;
# - running the workflow manually with `publish: testpypi` rehearses the
#   release on TestPyPI.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built artifacts
        type: choice
        options: [none, testpypi]
        default: none

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  wheels:
    name: Wheel (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - platform: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/sui-python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist
          sccache: true

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: crates/sui-python/dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/sui-python
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: crates/sui-python/dist/*.tar.gz
          if-no-files-found: error

  test:
    name: Test (${{ matrix.platform }}, Python ${{ matrix.python }})
    needs: wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
        platform: [linux-x86_64, macos-arm64, windows-x86_64]
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: macos-arm64
            runner: macos-latest
          - platform: windows-x86_64
            runner: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install a software Vulkan driver for offscreen rendering
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes mesa-vulkan-drivers

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: dist

      - name: Install the wheel in a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$RUNNER_TEMP/venv/Scripts" >> "$GITHUB_PATH"
            PYTHON="$RUNNER_TEMP/venv/Scripts/python"
          else
            echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
            PYTHON="$RUNNER_TEMP/venv/bin/python"
          fi
          "$PYTHON" -m pip install --upgrade pip
          "$PYTHON" -m pip install --no-index --find-links dist sinomo-ui
          "$PYTHON" -m pip install pytest mypy

      - name: Run the test suite against the installed wheel
        working-directory: crates/sui-python
        # Run from the tests directory's parent, but import the installed
        # package rather than the source tree.
        run: python -m pytest -q -p no:cacheprovider tests

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'testpypi'
    needs: [wheels, sdist, test]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/sinomo-ui
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sinomo-ui
    permissions:
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check that the tag matches the package version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match workspace version $version" >&2
            exit 1
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
