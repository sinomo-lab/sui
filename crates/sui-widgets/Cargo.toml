[package]
name = "sinomo-ui-widgets"
version.workspace = true
description = "Built-in widget library for SUI."
edition.workspace = true
authors.workspace = true
categories.workspace = true
homepage.workspace = true
keywords.workspace = true
license-file.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "sui_widgets"
doctest = false

[features]
# `Serialize` and `Deserialize` for persisted layout snapshots.
serde = ["dep:serde"]

[dependencies]
palette = { workspace = true }
pulldown-cmark = { workspace = true }
serde = { workspace = true, optional = true }
sui-animation = { workspace = true }
sui-core = { workspace = true }
sui-layout = { workspace = true }
sui-tabler = { workspace = true }
sui-reactive = { workspace = true }
sui-runtime = { workspace = true }
sui-scene = { workspace = true }
sui-text = { workspace = true }
unicode-segmentation = { workspace = true }
web-time = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
sui-render-wgpu = { workspace = true }
