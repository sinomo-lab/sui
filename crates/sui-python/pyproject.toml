[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "sinomo-ui"
dynamic = ["version"]
description = "Python bindings for SUI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Software Development :: User Interfaces",
]

[tool.maturin]
bindings = "pyo3"
python-source = "python"
module-name = "sinomo_ui._native"
features = ["extension-module", "desktop"]

[dependency-groups]
dev = [
    "maturin>=1.15,<2",
    "mypy>=1.15",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "desktop: opens real desktop windows; runs only with SUI_DESKTOP_TESTS=1",
]
